name: server

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # Same image as infra/docker-compose.yml, for the Postgres smoke test (tests/test_db.py).
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: alfred
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: alfred
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfred -d alfred"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://alfred:ci-only@127.0.0.1:5432/alfred
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install Python and dependencies
        run: uv sync --locked

      # Speech models used by tests marked `model` (tiny.en, ~75 MB).
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('server/tests/test_stt.py') }}
          restore-keys: hf-models-

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy alfred_server tests

      - name: Tests
        run: uv run pytest
