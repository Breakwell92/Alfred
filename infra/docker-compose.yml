# Alfred home-server stack. Run from infra/: `docker compose up -d` (see docs/infra.md).
# Compose reads infra/.env (copy infra/.env.example). Later tickets add STT, TTS
# and the server itself.
name: alfred

services:
  postgres:
    # pgvector build of the official Postgres image, so Agno memory/knowledge can use
    # embeddings later.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-alfred}
    ports:
      # Loopback only by default: the database holds tokens, memory and logs.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.40.10}
    restart: unless-stopped
    environment:
      # Keep the router and one main model resident together.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      # Flash attention + q8 KV cache roughly halve context memory, leaving room for STT/TTS.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Also trust any PEM certs in infra/certs/ (for hosts whose HTTPS is intercepted,
      # e.g. by antivirus web scanning). Empty directory = system CAs only.
      SSL_CERT_DIR: /etc/ssl/certs:/usr/local/share/alfred-certs
    ports:
      # Loopback by default; set OLLAMA_BIND_ADDRESS to the Tailscale IP to reach it remotely.
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./certs:/usr/local/share/alfred-certs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: create LiteLLM's own database in the shared Postgres. Runs on every `up`
  # (a no-op once the database exists), so it also works on an existing data volume,
  # where /docker-entrypoint-initdb.d scripts would never run.
  litellm-db-init:
    image: pgvector/pgvector:pg18
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-alfred}
      PGDATABASE: ${POSTGRES_DB:-alfred}
      # Same variable as the postgres service; psql reads it as PGPASSWORD (set below).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      LITELLM_DB: ${LITELLM_DB:-litellm}
    command:
      - sh
      - -c
      - >-
        export PGPASSWORD="$${POSTGRES_PASSWORD}";
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${LITELLM_DB}'" | grep -q 1
        || psql -c "CREATE DATABASE \"$${LITELLM_DB}\""
    depends_on:
      postgres:
        condition: service_healthy

  # Model gateway: every LLM call (local and cloud) goes through here. See docs/infra.md.
  litellm:
    image: ghcr.io/berriai/litellm-database:${LITELLM_IMAGE_TAG:-v1.106.3}
    restart: unless-stopped
    # render_config.py fills ${VAR}s in config.yaml and drops cloud aliases without a key,
    # then execs the proxy.
    entrypoint:
      - python
      - /etc/litellm/render_config.py
      - /etc/litellm/config.yaml
      - /tmp/litellm-config.yaml
      - --
      - litellm
      - --config
      - /tmp/litellm-config.yaml
      - --port
      - "4000"
    command: []
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in infra/.env}
      # Encrypts provider credentials LiteLLM stores in its database. Never change it once set.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in infra/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alfred}:${POSTGRES_PASSWORD}@postgres:5432/${LITELLM_DB:-litellm}
      # Use the price table shipped with the pinned image: reproducible costs, no fetch at boot.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Cloud keys: an empty key disables its alias (cloud-claude / cloud-gpt / cloud-gemini).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_LOCAL_ROUTER_MODEL: ${LITELLM_LOCAL_ROUTER_MODEL:-}
      LITELLM_LOCAL_MAIN_MODEL: ${LITELLM_LOCAL_MAIN_MODEL:-}
      LITELLM_EVAL_CANDIDATE_MODEL: ${LITELLM_EVAL_CANDIDATE_MODEL:-}
      LITELLM_CLOUD_CLAUDE_MODEL: ${LITELLM_CLOUD_CLAUDE_MODEL:-}
      LITELLM_CLOUD_GPT_MODEL: ${LITELLM_CLOUD_GPT_MODEL:-}
      LITELLM_CLOUD_GEMINI_MODEL: ${LITELLM_CLOUD_GEMINI_MODEL:-}
      # PEM certs in infra/certs/ are added to LiteLLM's CA bundle (hosts whose HTTPS is
      # intercepted, e.g. by antivirus web scanning). Empty directory = default bundle only.
      EXTRA_CA_DIR: /usr/local/share/alfred-certs
    ports:
      # Loopback by default; set LITELLM_BIND_ADDRESS to the Tailscale IP to reach it remotely.
      - "${LITELLM_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm:/etc/litellm:ro
      - ./certs:/usr/local/share/alfred-certs:ro
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  ollama-models:
