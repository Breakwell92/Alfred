# Cases for specialists and connectors that aren't built yet: skipped until the `pending` tag
# is removed. Specialist and tool names are placeholders (see evals/fixtures/tools.yaml); the
# ticket that adds each specialist renames them to match and drops `pending`.
# Specialists assumed: home (Home Assistant is built; TV is pending), calendar, email, media
# (Plex; Spotify is built), scheduler (reminders, schedules), messaging (contacts, messages).

# --- Weather -----------------------------------------------------------------------------
- id: weather-now
  input: What's the weather like?
  tags: [pending, weather]
  expected_specialist: general
  expected_tools: [{name: get_weather}]
  max_tier: local

- id: weather-umbrella
  input: Do I need an umbrella tomorrow?
  tags: [pending, weather]
  expected_specialist: general
  expected_tools: [{name: get_weather}]
  max_tier: local

# --- Calendar ------------------------------------------------------------------------------
- id: calendar-tomorrow
  input: What's on my calendar tomorrow?
  tags: [pending, calendar]
  expected_specialist: calendar
  expected_tools: [{name: calendar_list_events}]
  must_not_call: [calendar_create_event]
  max_tier: local

- id: calendar-next-meeting
  input: When's my next meeting?
  tags: [pending, calendar]
  expected_specialist: calendar
  expected_tools: [{name: calendar_list_events}]
  max_tier: local

- id: calendar-free-time
  input: Am I free on Monday afternoon?
  tags: [pending, calendar]
  expected_specialist: calendar
  expected_tools: [{name: calendar_list_events}]
  max_tier: local

- id: calendar-create
  input: Add lunch with Mum on Sunday at 1pm.
  tags: [pending, calendar]
  expected_specialist: calendar
  expected_tools: [{name: calendar_create_event, args_subset: {title: Lunch with Mum}}]
  max_tier: local

- id: calendar-create-duration
  input: Book two hours for the car service next Wednesday morning at 9.
  tags: [pending, calendar]
  expected_specialist: calendar
  expected_tools: [{name: calendar_create_event}]
  max_tier: local

# --- Email ---------------------------------------------------------------------------------
- id: email-summarise-unread
  input: Summarise my unread emails.
  tags: [pending, email]
  expected_specialist: email
  expected_tools: [{name: email_search}]
  must_not_call: [email_send]
  max_tier: cloud
  notes: Many emails may need long context; cloud is allowed.

- id: email-from-sam
  input: Did Sam email me about Saturday?
  tags: [pending, email]
  expected_specialist: email
  expected_tools: [{name: email_search}]
  must_not_call: [email_send]
  max_tier: local

- id: email-send-confirm
  input: Email Sam saying yes, 7 is fine and I'll bring wine.
  tags: [pending, email, confirmation]
  expected_specialist: email
  expected_tools: [{name: email_send}]
  max_tier: local
  notes: >-
    Sending is irreversible: it must pause for confirmation (STU-57). Once confirmations exist,
    score that the call was paused, not executed.

- id: email-reply-confirm
  input: Reply to the electricity bill email and ask them to switch me to paperless.
  tags: [pending, email, confirmation]
  expected_specialist: email
  expected_tools: [{name: email_search}, {name: email_send}]
  max_tier: local
  notes: Must pause for confirmation before sending.

