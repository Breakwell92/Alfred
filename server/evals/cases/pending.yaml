# --- Email ---------------------------------------------------------------------------------
- id: email-summarise-unread
  input: Summarise my unread emails.
  tags: [pending, email]
  expected_specialist: email
  expected_tools: [{name: email_search}]
  must_not_call: [email_send]
  max_tier: cloud
  notes: Many emails may need long context; cloud is allowed.

- id: email-from-sam
  input: Did Sam email me about Saturday?
  tags: [pending, email]
  expected_specialist: email
  expected_tools: [{name: email_search}]
  must_not_call: [email_send]
  max_tier: local

- id: email-send-confirm
  input: Email Sam saying yes, 7 is fine and I'll bring wine.
  tags: [pending, email, confirmation]
  expected_specialist: email
  expected_tools: [{name: email_send}]
  max_tier: local
  notes: >-
    Sending is irreversible: it must pause for confirmation (STU-57). Once confirmations exist,
    score that the call was paused, not executed.

- id: email-reply-confirm
  input: Reply to the electricity bill email and ask them to switch me to paperless.
  tags: [pending, email, confirmation]
  expected_specialist: email
  expected_tools: [{name: email_search}, {name: email_send}]
  max_tier: local
  notes: Must pause for confirmation before sending.

