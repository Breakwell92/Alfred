# Cases for specialists and connectors that aren't built yet: skipped until the `pending` tag
# is removed. Specialist and tool names are placeholders (see evals/fixtures/tools.yaml); the
# ticket that adds each specialist renames them to match and drops `pending`.
# Specialists assumed: home (Home Assistant lights/heating, TV), calendar, email, media
# (Spotify, Plex), scheduler (reminders, schedules), messaging (contacts, messages).

# --- Weather -----------------------------------------------------------------------------
- id: weather-now
  input: What's the weather like?
  tags: [pending, weather]
  expected_specialist: general
  expected_tools: [{name: get_weather}]
  max_tier: local

- id: weather-umbrella
  input: Do I need an umbrella tomorrow?
  tags: [pending, weather]
  expected_specialist: general
  expected_tools: [{name: get_weather}]
  max_tier: local

# --- Lights and heating --------------------------------------------------------------------
- id: lights-on-room
  input: Turn on the kitchen lights.
  tags: [pending, home, lights]
  expected_specialist: home
  expected_tools: [{name: light_turn_on, args_subset: {area: kitchen}}]
  max_tier: local

- id: lights-off-active-room
  input: Lights off.
  tags: [pending, home, lights]
  context: {active_room: bedroom}
  expected_specialist: home
  expected_tools: [{name: light_turn_off, args_subset: {area: bedroom}}]
  max_tier: local
  notes: "\"Lights\" means the phone's active room."

- id: lights-dim
  input: Dim the living room lights to 30 percent.
  tags: [pending, home, lights]
  expected_specialist: home
  expected_tools: [{name: light_set_brightness, args_subset: {area: living room, percent: 30}}]
  max_tier: local

- id: lights-all-off
  input: Turn off all the lights downstairs.
  tags: [pending, home, lights]
  expected_specialist: home
  expected_tools: [{name: light_turn_off}]
  max_tier: local

- id: heating-set
  input: Set the heating to 21 degrees.
  tags: [pending, home, heating]
  expected_specialist: home
  expected_tools: [{name: heating_set_temperature, args_subset: {temperature_c: 21}}]
  max_tier: local

- id: heating-status
  input: Is the heating on?
  tags: [pending, home, heating]
  expected_specialist: home
  expected_tools: [{name: heating_get_status}]
  must_not_call: [heating_set_temperature]
  max_tier: local

- id: heating-warmer
  input: It's cold in here, warm it up a bit.
  tags: [pending, home, heating]
  expected_specialist: home
  expected_tools: [{name: heating_set_temperature}]
  max_tier: local

