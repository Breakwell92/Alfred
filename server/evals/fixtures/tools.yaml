# Canned tool results for mock mode (evals/mocks.py). Strings are formatted with the request's
# `now` and `timezone` and the call's arguments; other values are sent as JSON.
# Tool names for connectors that aren't built yet are placeholders: rename them (and the cases)
# when the connector lands.

# Echo / general agent (alfred_server/agents/echo.py). Same format as the real tool.
get_time: "{now:%H:%M} on {now:%A} {now.day} {now:%B %Y} ({timezone})"

# Routines (alfred_server/connectors/builtin/routines.py). Same format as the real tools.
list_step_tools: >-
  [{"connector":"home_assistant","tool":"ha_turn_on","description":"Turn devices on or activate
  a scene.","asks_first":false,"parameters":{"type":"object","properties":{"domain":{"type":"string",
  "enum":["light","switch","fan","media_player","scene","input_boolean","climate","cover"]},
  "name":{"type":"string"},"area":{"type":"string"},"floor":{"type":"string"}},"required":["domain"]}},
  {"connector":"home_assistant","tool":"ha_turn_off","description":"Turn devices off.",
  "asks_first":false,"parameters":{"type":"object","properties":{"domain":{"type":"string"},
  "name":{"type":"string"},"area":{"type":"string"},"floor":{"type":"string"}},"required":["domain"]}},
  {"connector":"home_assistant","tool":"ha_set_light","description":"Set light brightness or
  colour.","asks_first":false,"parameters":{"type":"object","properties":{"name":{"type":"string"},
  "area":{"type":"string"},"floor":{"type":"string"},"brightness":{"type":"integer"},
  "color":{"type":"string"}},"required":[]}},
  {"connector":"spotify","tool":"spotify_play","description":"Play music.","asks_first":false,
  "parameters":{"type":"object","properties":{"query":{"type":"string"},"device":{"type":"string"}},
  "required":[]}}]
save_routine: "Saved the {name} routine. Say '{name}' to run it."
list_routines: "movie time: say movie time; it will set the lounge lights and turn on media_player TV."
delete_routine: "Deleted the {name} routine."

