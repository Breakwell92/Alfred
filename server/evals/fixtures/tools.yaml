# Home Assistant (alfred_server/connectors/builtin/home_assistant.py). Same style as the real
# tools: HA's live context for ha_get_state, a short sentence for the rest.
ha_get_state: |
  Live Context: An overview of the areas and the devices in this smart home:
  - names: Kitchen Lights
    domain: light
    state: 'on'
    areas: Kitchen
  - names: Lounge Lights
    domain: light
    state: 'on'
    areas: Lounge
    attributes:
      brightness: '100'
  - names: Lounge TV
    domain: media_player
    state: 'off'
    areas: Lounge
  - names: Bedroom Lights
    domain: light
    state: 'on'
    areas: Bedroom
  - names: Thermostat
    domain: climate
    state: heat
    areas: Hall
    attributes:
      current_temperature: '18.5'
      temperature: '20'
  - names: Front Door
    domain: lock
    state: unlocked
    areas: Hall
  - names: Back Door
    domain: lock
    state: locked
    areas: Kitchen
  - names: Garage Door
    domain: cover
    state: closed
    areas: Garage
    attributes:
      device_class: garage
  - names: Movie Time
    domain: scene
ha_turn_on: "Done."
ha_turn_off: "Done."
ha_set_light: "Done."
ha_set_temperature: "Done: Thermostat."
ha_lock: "Done: Front Door."
ha_unlock: "Done: Front Door."
ha_open_door: "Done: Garage Door."
ha_close_door: "Done: Garage Door."

