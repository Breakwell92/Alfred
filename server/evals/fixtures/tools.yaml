  now: {summary: Light rain, temperature_c: 11, wind_mph: 14}
  today: {high_c: 13, low_c: 7, rain_chance: 80}
  tomorrow: {summary: Sunny intervals, high_c: 15, low_c: 6, rain_chance: 10}

