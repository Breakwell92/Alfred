[project]
name = "alfred-server"
version = "0.1.0"
description = "Alfred home server: speech, agents, connectors and scheduler."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "agno==3.1.10",
    "cryptography>=44",
    "fastapi>=0.115",
    "faster-whisper>=1.2",
    "fastmcp>=4,<5",
    "httpx>=0.27",
    "kokoro-onnx>=0.6",
    "mcp>=2.1,<3",
    "numpy>=2.0",
    # Provides the `onnxruntime` module for Kokoro and Piper TTS. Also runs on CPU; replaces
    # the CPU-only `onnxruntime` package (see [tool.uv] below).
    "onnxruntime-gpu>=1.22",
    "openai>=3.30",
    "openinference-instrumentation-agno>=1.0.15",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "piper-tts>=1.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "soxr>=0.5",
    "sqlalchemy[asyncio]>=2.0",
    # IANA timezones for zoneinfo on Windows, which has no system tz database.
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
cuda = [
    # cuBLAS/cuDNN for faster-whisper (STT, CUDA 12).
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
    # CUDA/cuDNN for onnxruntime-gpu (TTS), loaded with onnxruntime.preload_dlls().
    "onnxruntime-gpu[cuda,cudnn]>=1.22",
]

[tool.uv]
# kokoro-onnx and piper-tts depend on the CPU-only `onnxruntime`, which installs the same module
# as `onnxruntime-gpu` and would overwrite it. Never install it: onnxruntime-gpu runs on CPU too.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
# The server runs on Windows or Linux x86-64; make the lock pick NVIDIA wheels that exist there.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfred_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: loads a real speech model (downloads it on first run); deselect with -m 'not model'",
    "integration: calls the real LiteLLM gateway (needs LITELLM_TEST_URL/KEY); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Lenient for now: tighten per module as the code base grows.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
